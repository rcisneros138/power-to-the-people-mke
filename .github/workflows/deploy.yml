name: Deploy to Cloudflare

on:
  push:
    branches: [main, staging]
  repository_dispatch:
    types: [wordpress_update]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `staging` branch -> staging origin (robots disallow + meta noindex are
      # derived from this in app/lib/site.ts). Everything else, including the
      # repository_dispatch from WordPress, builds as production.
      - run: pnpm build
        env:
          WORDPRESS_GRAPHQL_URL: ${{ secrets.WORDPRESS_GRAPHQL_URL }}
          NEXT_PUBLIC_SITE_URL: >-
            ${{ github.ref == 'refs/heads/staging'
                && 'https://staging.powertothepeoplemke.org'
                || 'https://powertothepeoplemke.org' }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: >-
            ${{ github.ref == 'refs/heads/staging'
                && 'deploy --env staging'
                || 'deploy' }}
